<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추억의 사전</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --toggle-bg: #ffffff;
            --toggle-border: #000000;
        }
        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #ffffff;
            --toggle-bg: #000000;
            --toggle-border: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        header p {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .toggle-container {
            margin-bottom: 40px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 220px;
            height: 40px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            border: 2px solid var(--toggle-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 32px;
            width: 100px;
            left: 3px;
            bottom: 2px;
            background-color: #000000;
            border-radius: 16px;
            transition: 0.3s;
            z-index: 1;
        }
        [data-theme="dark"] .slider:before {
            background-color: #ffffff;
        }
        .slider .label-left {
            color: #ffffff;
            z-index: 2;
        }
        .slider .label-right {
            color: #000000;
            z-index: 2;
        }
        input:checked + .slider:before {
            transform: translateX(110px);
        }
        body:not([data-theme="dark"]) input:not(:checked) + .slider .label-right { color: #000000; }
        body:not([data-theme="dark"]) input:checked + .slider .label-left { color: #000000; }
        .content-section {
            width: 100%;
            max-width: 800px;
            display: none;
        }
        .content-section.active {
            display: block;
        }
        #introduction {
            line-height: 1.6;
            text-align: justify;
        }
        .alphabet-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
        }
        .letter-btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 8px 14px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .letter-btn:hover, .letter-btn.active {
            background-color: #ffffff;
            color: #000000;
        }
        .word-detail {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .big-letter {
            font-size: 6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .meaning-ko {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .meaning-en {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .artwork-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(45deg, #ff0055, #ff5500, #ffcc00, #00ccff); 
            border-radius: 8px;
        }
        .artwork-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>추억의 사전</h1>
        <p>Dictionary of the Lost Memories</p>
    </header>

    <div class="toggle-container">
        <label class="switch">
            <input type="checkbox" id="modeToggle">
            <span class="slider">
                <span class="label-left">Introduction</span>
                <span class="label-right">Dictionary</span>
            </span>
        </label>
    </div>

    <section id="introduction" class="content-section active">
        <p>프로젝트 소개 내용을 여기에 입력하세요. (Introduction content goes here)</p>
    </section>

    <section id="dictionary" class="content-section">
        <div class="alphabet-container">
            <button class="letter-btn" onclick="showWord('A')">A</button>
            <button class="letter-btn" onclick="showWord('B')">B</button>
            <button class="letter-btn" onclick="showWord('C')">C</button>
            <button class="letter-btn" onclick="showWord('D')">D</button>
            <button class="letter-btn" onclick="showWord('E')">E</button>
            <button class="letter-btn" onclick="showWord('F')">F</button>
            <button class="letter-btn" onclick="showWord('G')">G</button>
            <button class="letter-btn" onclick="showWord('H')">H</button>
            <button class="letter-btn" onclick="showWord('I')">I</button>
            <button class="letter-btn" onclick="showWord('J')">J</button>
            <button class="letter-btn" onclick="showWord('K')">K</button>
            <button class="letter-btn" onclick="showWord('L')">L</button>
            <button class="letter-btn" onclick="showWord('M')">M</button>
            <button class="letter-btn" onclick="showWord('N')">N</button>
            <button class="letter-btn" onclick="showWord('Ñ')">Ñ</button>
            <button class="letter-btn" onclick="showWord('O')">O</button>
            <button class="letter-btn" onclick="showWord('P')">P</button>
            <button class="letter-btn" onclick="showWord('Q')">Q</button>
            <button class="letter-btn" onclick="showWord('R')">R</button>
            <button class="letter-btn" onclick="showWord('S')">S</button>
            <button class="letter-btn" onclick="showWord('T')">T</button>
            <button class="letter-btn" onclick="showWord('U')">U</button>
            <button class="letter-btn" onclick="showWord('V')">V</button>
            <button class="letter-btn" onclick="showWord('W')">W</button>
            <button class="letter-btn" onclick="showWord('X')">X</button>
            <button class="letter-btn" onclick="showWord('Y')">Y</button>
            <button class="letter-btn" onclick="showWord('Z')">Z</button>
        </div>

        <div id="wordDetail" class="word-detail">
            <div class="big-letter" id="displayLetter">A</div>
            <div class="meaning-ko" id="displayKo">한국어 설명</div>
            <div class="meaning-en" id="displayEn">English explanation</div>
            <div class="artwork-box">
                <img id="displayImg" src="" alt="Artwork">
            </div>
        </div>
    </section>

    <script>
        const modeToggle = document.getElementById('modeToggle');
        const introSection = document.getElementById('introduction');
        const dictSection = document.getElementById('dictionary');
        const wordDetail = document.getElementById('wordDetail');

        const dictionaryData = {
            'A': { ko: '추억 / 기억', en: 'Memory / Remembrance', img: 'images/a-art.png' },
            'B': { ko: '상자', en: 'Box', img: 'images/b-art.png' },
            'C': { ko: '노래', en: 'Song', img: 'images/c-art.png' }
        };

        modeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                introSection.classList.remove('active');
                dictSection.classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                dictSection.classList.remove('active');
                introSection.classList.add('active');
            }
        });

        function showWord(letter) {
            const buttons = document.querySelectorAll('.letter-btn');
            buttons.forEach(btn => {
                if(btn.textContent === letter) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const data = dictionaryData[letter];
            if (data) {
                document.getElementById('displayLetter').textContent = letter;
                document.getElementById('displayKo').textContent = data.ko;
                document.getElementById('displayEn').textContent = data.en;
                document.getElementById('displayImg').src = data.img;
                wordDetail.style.display = 'block';
            } else {
                document.getElementById('displayLetter').textContent = letter;
                document.getElementById('displayKo').textContent = '준비 중인 단어입니다.';
                document.getElementById('displayEn').textContent = 'Coming soon.';
                document.getElementById('displayImg').src = '';
                wordDetail.style.display = 'block';
            }
        }
    </script>
</body>
</html>
